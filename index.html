<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>로또 번호 추천기</title>
    <meta
      name="description"
      content="1~45 중복 없는 로또 번호 6개를 랜덤으로 추천합니다."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=SUIT:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>

    <header class="topbar">
      <div class="topbarInner">
        <div class="topbarLeft">
          <div class="nLogo" aria-hidden="true">N</div>
          <div class="topbarTitle">로또 추천</div>
          <nav class="topbarNav" aria-label="메뉴">
            <a class="navLink" href="#recommend">추천</a>
            <a class="navLink" href="#historySection">기록</a>
          </nav>
        </div>
        <div class="topbarRight">
          <span class="pill">5세트 · 보너스 포함</span>
        </div>
      </div>
    </header>

    <main class="page">
      <section class="hero">
        <div class="heroInner">
          <div class="heroCopy">
            <h1 class="heroTitle">오늘 뽑을 번호, 빠르게.</h1>
            <p class="heroSub">
              1~45 중복 없는 6개 + 보너스 1개를 <strong>5세트</strong>로 추천합니다.
            </p>
            <div class="heroActions">
              <button id="btnGenerate" class="btn primary" type="button">
                번호 추천
              </button>
              <button id="btnCopy" class="btn ghost" type="button" disabled>
                복사
              </button>
              <button id="btnSave" class="btn ghost" type="button" disabled>
                기록 저장
              </button>
              <button id="btnClear" class="btn danger ghost" type="button">
                기록 삭제
              </button>
            </div>
          </div>

          <div class="heroPanel" aria-label="추천 옵션">
            <div class="panelTitle">옵션</div>
            <div class="row">
              <div class="field">
                <label for="seedMode">추천 방식</label>
                <select id="seedMode" class="select">
                  <option value="trueRandom" selected>완전 랜덤</option>
                  <option value="daily">오늘의 추천(매일 고정)</option>
                </select>
              </div>

              <div class="field">
                <label for="sortMode">정렬</label>
                <select id="sortMode" class="select">
                  <option value="asc" selected>오름차순</option>
                  <option value="none">생성 순서 유지</option>
                </select>
              </div>
            </div>
            <div class="panelNote">
              세트 수는 <strong>5세트 고정</strong>입니다.
            </div>
          </div>
        </div>
        <div class="heroFade" aria-hidden="true"></div>
      </section>

      <section id="recommend" class="rail" aria-label="추천 결과">
        <div class="railHeader">
          <h2 class="railTitle">추천 결과</h2>
          <div class="railHint">메인 6개 + 보너스 1개 (중복 없음)</div>
        </div>
        <div id="result" class="result" role="status" aria-live="polite">
          <div class="placeholder">
            아직 추천된 번호가 없어요. 상단의 <strong>번호 추천</strong>을 눌러주세요.
          </div>
        </div>
        <p id="toast" class="toast" role="status" aria-live="polite"></p>
      </section>

      <section id="historySection" class="rail" aria-label="저장된 기록">
        <div class="railHeader">
          <h2 class="railTitle">저장된 기록</h2>
          <div class="railHint">로컬 저장소(LocalStorage)에 저장됩니다.</div>
        </div>
        <div id="history" class="history empty">
          <div class="historyEmpty">저장된 기록이 없습니다.</div>
        </div>
      </section>

      <footer class="footer">
        <p>
          주의: 당첨을 보장하지 않습니다. 재미로 사용해주세요.
        </p>
      </footer>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
