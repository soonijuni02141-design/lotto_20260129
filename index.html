<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>하루 위로 문구</title>
    <meta
      name="description"
      content="하루하루 마음을 위로해주는 문구를 건네드립니다. 오늘의 문구는 매일 고정되고, 마음에 드는 문구는 저장할 수 있어요."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=SUIT:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>

    <header class="topbar">
      <div class="topbarInner">
        <div class="topbarLeft">
          <div class="nLogo" aria-hidden="true">W</div>
          <div class="topbarTitle">하루 위로</div>
          <nav class="topbarNav" aria-label="메뉴">
            <a class="navLink" href="#today">오늘</a>
            <a class="navLink" href="#savedSection">저장</a>
          </nav>
        </div>
        <div class="topbarRight">
          <button id="btnTheme" class="btn ghost mini" type="button">
            다크모드
          </button>
        </div>
      </div>
    </header>

    <main class="page">
      <section class="hero">
        <div class="heroInner">
          <div class="heroCopy">
            <h1 class="heroTitle">오늘도, 당신 편이에요.</h1>
            <p class="heroSub">짧지만 따뜻한 문장 하나로, 오늘을 조금 가볍게.</p>
            <div class="heroActions">
              <button id="btnNew" class="btn primary" type="button">
                다른 문구 5개 보기
              </button>
              <button id="btnCopy" class="btn ghost" type="button">
                5개 복사
              </button>
              <button id="btnSave" class="btn ghost" type="button">
                5개 저장
              </button>
              <button id="btnShare" class="btn ghost" type="button">
                공유
              </button>
            </div>
          </div>

          <div class="heroPanel" aria-label="오늘의 안내">
            <div class="panelTitle">오늘의 문구</div>
            <div class="panelNote">
              오늘의 문구는 <strong>매일 한 번</strong> 바뀌어요. “다른 문구 보기”는 오늘
              안에서만 바뀝니다.
            </div>
            <div class="panelNote">
              마음에 드는 문구는 저장해두고, 나중에 다시 꺼내볼 수 있어요.
            </div>
          </div>
        </div>
        <div class="heroFade" aria-hidden="true"></div>
      </section>

      <section id="today" class="rail" aria-label="오늘의 문구">
        <div class="railHeader">
          <h2 class="railTitle">오늘의 문구</h2>
          <div id="todayMeta" class="railHint"></div>
        </div>
        <article id="quoteCard" class="quoteCard" aria-live="polite">
          <div id="quoteWhen" class="quoteWhen"></div>
          <div id="quoteList" class="quoteList"></div>
        </article>
        <p id="toast" class="toast" role="status" aria-live="polite"></p>
      </section>

      <section id="savedSection" class="rail" aria-label="저장한 문구">
        <div class="railHeader">
          <h2 class="railTitle">저장한 문구</h2>
          <div class="railHint">이 브라우저에만 저장됩니다.</div>
        </div>
        <div class="savedActions">
          <button id="btnClearSaved" class="btn danger ghost mini" type="button">
            저장 전체 삭제
          </button>
        </div>
        <div id="savedList" class="history empty">
          <div class="historyEmpty">저장된 문구가 없습니다.</div>
        </div>
      </section>

      <footer class="footer">
        <p>
          힘들 땐, 오늘 하루만 잘 버텨도 충분해요.
        </p>
      </footer>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
